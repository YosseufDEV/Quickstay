name: devdbs

services:
  postgres:
    image: postgres:latest
    container_name: devdb 
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  pg-bouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:admin@postgres:5432/devdb
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  assets:
    image: imageserver
    container_name: assets
    restart: unless-stopped
    ports:
      - "5001:80"

volumes:
  postgres_data:
  redis_data:
