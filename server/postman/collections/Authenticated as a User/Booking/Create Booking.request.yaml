$kind: http-request
name: Create Booking
url: "{{baseURL}}/bookings"
method: POST
headers:
  Idempotency-Key: test1234
body:
  type: json
  content: "{\r

    \    \"hotelId\": \"{{hotelId}}\",\r

    \    \"roomTypeId\": \"{{hotelRoomTypeId}}\",\r

    \    \"checkIn\": \"2026-10-02\",\r

    \    \"checkOut\": \"2026-10-03\"\r

    }"
scripts:
  - type: beforeRequest
    code: "let rawBody = pm.request.body.raw;\r

      \r

      let bodyObject = rawBody ? JSON.parse(rawBody) : {};\r

      \r

      if(!bodyObject.checkIn)\r

      \    bodyObject.checkIn = new Date();\r

      if(!bodyObject.checkOut)\r

      \    bodyObject.checkOut = new Date(bodyObject.checkIn.getTime() + 24*60*60*1001);\r

      \r

      // 4. Update the request body with the modified JSON string\r

      pm.request.body.update({\r

      \    mode: 'raw',\r

      \    raw: JSON.stringify(bodyObject, null, 2),\r

      \    options: {\r

      \        raw: { language: 'json' }\r

      \    }\r

      });"
    language: text/javascript
settings: {}
order: 1000
